# Drafts the next release from merged PR labels (Semantic Versioning):
#   breaking / major  -> next major, feature / enhancement / minor -> next minor,
#   everything else   -> next patch.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels:
      - breaking
      - major
  minor:
    labels:
      - feature
      - enhancement
      - minor
  patch:
    labels:
      - bug
      - fix
      - chore
      - refactor
      - documentation
      - dependencies
  default: patch
categories:
  - title: Breaking changes
    labels:
      - breaking
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Bug fixes
    labels:
      - bug
      - fix
  - title: Maintenance
    labels:
      - chore
      - refactor
      - dependencies
  - title: Documentation
    labels:
      - documentation
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
template: |
  $CHANGES

  Full changelog: https://github.com/$OWNER/$REPOSITORY/blob/master/CHANGELOG.md
