name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, unit and integration tests
        run: mvn -B verify
      - name: Benchmarks compile against this build
        run: |
          mvn -B -q -DskipTests install
          mvn -B -q -f benchmarks/pom.xml -DskipTests package
      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: denis-server
          path: |
            target/denis-*.jar
            target/denis-*-project-bundle.*
          if-no-files-found: error

  java-driver:
    name: Java driver (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
        working-directory: java-driver

  node-client:
    name: Node client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: clients/node

  studio:
    name: Denis Studio (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm test
        working-directory: studio

  web:
    name: Denis Cloud (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web

  docker:
    name: Docker image + client integration tests
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: denis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start server
        run: |
          docker run -d --name denis -p 5142:5142 \
            -e DENIS_BOOTSTRAP_GROUP=ci -e DENIS_BOOTSTRAP_GROUP_PASSWORD=ci-password \
            -e DDB_MAIN_TOKEN="$(printf 'C%.0s' $(seq 1 128))" \
            -e DENIS_PASSWORD_ITERATIONS=20000 denis:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' denis)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs denis
          [ "$status" = healthy ]
      - name: CLI works inside the container
        run: |
          docker exec denis /app/entrypoint.sh cli group list | grep '^ci'
          docker exec denis /app/entrypoint.sh cli group test ci ci-password
          docker exec denis /app/entrypoint.sh backup create -g ci -p ci-password
          docker exec denis /app/entrypoint.sh backup list | grep 'denis-'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node client integration tests
        working-directory: clients/node
        env:
          DENIS_INTEGRATION: "1"
          DENIS_GROUP: ci
          DENIS_PASSWORD: ci-password
        run: npm run test:integration
      - name: MCP server tests (unit + integration through the SDK client)
        working-directory: clients/mcp
        env:
          DENIS_INTEGRATION: "1"
          DENIS_GROUP: ci
          DENIS_PASSWORD: ci-password
        run: |
          npm install --no-audit --no-fund
          node --test test/*.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Java driver integration tests
        working-directory: java-driver
        env:
          DENIS_INTEGRATION: "1"
          DENIS_GROUP: ci
          DENIS_PASSWORD: ci-password
        run: mvn -B test
      - name: Data survives a restart
        run: |
          token=$(docker exec denis /app/entrypoint.sh cli exec --json -g ci -p ci-password "AUTH CREATE" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          docker exec denis /app/entrypoint.sh cli exec --json -g ci -p ci-password -t "$token" "SET survivor yes -&save"
          docker restart denis
          sleep 8
          docker exec denis /app/entrypoint.sh cli exec --json -g ci -p ci-password -t "$token" "GET survivor" | grep '"data":"yes"'
      - name: Server logs
        if: always()
        run: docker logs denis || true
