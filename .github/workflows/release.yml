name: Release

# Pushing a tag such as v0.3.0 builds the jar and the project bundle, publishes
# the Docker image to GHCR (ghcr.io/<owner>/denis:<version> and :latest) and
# creates the GitHub Release with the artifacts and the matching CHANGELOG entry.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pom=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          if [ "$pom" != "$version" ]; then
            echo "pom.xml version ($pom) does not match tag ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B package

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for ${{ steps.version.outputs.version }}" > release-notes.md
          fi
          cat release-notes.md

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/denis" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          name: Denis ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: |
            target/denis-${{ steps.version.outputs.version }}.jar
            target/denis-${{ steps.version.outputs.version }}-project-bundle.zip
            target/denis-${{ steps.version.outputs.version }}-project-bundle.tar.gz
