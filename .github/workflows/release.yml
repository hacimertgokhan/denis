name: Release

# Pushing a tag such as v0.7.0 (it must match <version> in pom.xml):
#   - the server jar and bundles (zip, tar.gz) with .sha256 files, used by install.sh / install.ps1
#   - a multi-arch Docker image (amd64, arm64) on ghcr.io: <version> and latest
#   - Denis Studio installers for Windows, macOS and Linux
#   - a GitHub Release whose notes are the matching CHANGELOG.md section
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pom=$(sed -n 's:^    <version>\(.*\)</version>:\1:p' pom.xml | head -1)
          if [ "$pom" != "$version" ]; then
            echo "pom.xml version ($pom) does not match tag ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
      - name: Checksums
        run: |
          cd target
          for f in denis-${{ steps.version.outputs.version }}.jar denis-${{ steps.version.outputs.version }}-project-bundle.zip denis-${{ steps.version.outputs.version }}-project-bundle.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "No CHANGELOG.md section for ${{ steps.version.outputs.version }}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Denis ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: |
            target/denis-${{ steps.version.outputs.version }}.jar
            target/denis-${{ steps.version.outputs.version }}*.sha256
            target/denis-${{ steps.version.outputs.version }}-project-bundle.zip
            target/denis-${{ steps.version.outputs.version }}-project-bundle.tar.gz
            install.sh
            install.ps1

  docker:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/denis" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.server.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.server.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  studio:
    needs: server
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: studio
      - run: npm test
        working-directory: studio
      - name: Package
        working-directory: studio
        run: npm run dist
        env:
          # unsigned builds; set CSC_LINK / CSC_KEY_PASSWORD (and Apple notarisation secrets) to sign
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            studio/dist/*.exe
            studio/dist/*.dmg
            studio/dist/*.AppImage
            studio/dist/*.deb
