name: Release

# Push a tag like v0.1.0 to publish:
#   - the server bundle (zip + tar.gz) with .sha256 files, used by install.sh / install.ps1
#   - a multi-arch Docker image (amd64, arm64) on ghcr.io
#   - Denis Studio installers for Windows, macOS and Linux
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build (version from the tag)
        run: |
          version="${GITHUB_REF_NAME#v}"
          mvn -B -q versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
          mvn -B verify
          cd target
          for f in denis-"$version"-project-bundle.zip denis-"$version"-project-bundle.tar.gz denis-"$version".jar; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/denis-*-project-bundle.*
            target/denis-*.jar
            target/denis-*.jar.sha256
            install.sh
            install.ps1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  studio:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: studio
      - run: npm test
        working-directory: studio
      - name: Package
        working-directory: studio
        run: npm run dist
        env:
          # unsigned builds; set CSC_LINK / CSC_KEY_PASSWORD (and Apple notarisation secrets) to sign
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            studio/dist/*.exe
            studio/dist/*.dmg
            studio/dist/*.AppImage
            studio/dist/*.deb
