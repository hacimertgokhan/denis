services:
  denis:
    build: .
    image: denis:local
    container_name: denis
    ports:
      # bind to 127.0.0.1 on the host unless other machines must reach it
      - "${DENIS_PUBLISH:-127.0.0.1}:${DDB_PORT:-5142}:5142"
    environment:
      DDB_PORT: "5142"
      # admin group created on first start so clients can LIN immediately
      DENIS_BOOTSTRAP_GROUP: "${DENIS_BOOTSTRAP_GROUP:-admin}"
      DENIS_BOOTSTRAP_GROUP_PASSWORD: "${DENIS_BOOTSTRAP_GROUP_PASSWORD:?set DENIS_BOOTSTRAP_GROUP_PASSWORD in .env}"
      DENIS_FSYNC: "${DENIS_FSYNC:-everysec}"
      DENIS_MAX_MEMORY: "${DENIS_MAX_MEMORY:-0}"
      DENIS_BACKUP_INTERVAL_MINUTES: "${DENIS_BACKUP_INTERVAL_MINUTES:-0}"
      DENIS_BACKUP_RETENTION: "${DENIS_BACKUP_RETENTION:-7}"
      DENIS_MAX_CONNECTIONS_PER_IP: "${DENIS_MAX_CONNECTIONS_PER_IP:-64}"
    volumes:
      - denis-data:/data
    restart: unless-stopped
    # give the final checkpoint time on "docker compose down"
    stop_grace_period: 60s

volumes:
  denis-data:
