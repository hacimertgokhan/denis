# Denis Database configuration.
#
# Every key can also be set from the environment as DENIS_<KEY> with - replaced
# by _ (DENIS_BIND_ADDRESS, DENIS_MAX_MEMORY, ...). The ddb-* keys are also read
# without the prefix: DDB_PORT. Environment beats this file.
# Sizes accept kb/mb/gb suffixes.

# ---------------------------------------------------------------- network
# 127.0.0.1 accepts only local clients; 0.0.0.0 accepts every interface.
bind-address=127.0.0.1
ddb-port=5142
max-clients=10000
max-connections-per-ip=64
# A command line longer than this closes the connection.
max-line-size=8mb
# Replies a client does not read are buffered up to this, then it is not read from.
client-output-limit=64mb
# Close connections idle for this many seconds (0 = never).
client-timeout-seconds=0
# Network threads (0 = one per two cores, 1 to 8) and threads for slow commands
# such as login, SQL and backups (0 = one per core, 2 to 8).
io-threads=0
worker-threads=0
worker-queue-size=1024

# ---------------------------------------------------------------- storage
data-dir=data
# on | off. off keeps everything in memory only (nothing is written to disk).
persistence=on
# always   : acknowledge durable writes only after fsync (group commit)
# everysec : fsync once per second; at most ~1 s of writes lost on power loss
# no       : let the operating system decide
fsync=everysec
wal-segment-size=16mb
# A checkpoint (new snapshot, old log removed) runs after this much log...
checkpoint-wal-size=64mb
# ...or after this many seconds when anything changed.
checkpoint-interval-seconds=300
snapshot-compression=true
# strict refuses to start on a damaged log segment; lenient keeps what can be read.
recovery=strict
# Denis 0.0.x database file, imported once on first start.
legacy-database-file=database.bin

# ---------------------------------------------------------------- memory
# Upper bound for data in memory (0 = unlimited). Leave headroom below the JVM heap (-Xmx).
max-memory=0
# cache-lru : evict cache-only keys, least recently used first
# noeviction: refuse writes at the limit
eviction-policy=cache-lru
# SELECT results larger than this are refused (use LIMIT).
max-result-rows=100000
# Upper bound for one KEYS reply.
keys-limit=100000

# ---------------------------------------------------------------- security
groups-file=denis.toml
projects-file=ddb.json
# Lock an address out for login-lockout-seconds after this many failed logins (0 = off).
login-max-failures=10
login-lockout-seconds=60
# PBKDF2-HMAC-SHA512 rounds for new password hashes (lower it on very slow devices).
password-iterations=210000
# Projects created by a group can only be opened by that group (and admins).
enforce-project-ownership=true

# ---------------------------------------------------------------- backups
# Empty = <data-dir>/backups
backup-dir=
# Take a backup every N minutes (0 = only on demand) and keep the newest N.
backup-interval-minutes=0
backup-retention=7

# ---------------------------------------------------------------- provisioning
# Create this admin group on start-up when it does not exist yet, so a fresh
# install / container accepts LIN without running 'denis init'.
# Usually given as DENIS_BOOTSTRAP_GROUP / DENIS_BOOTSTRAP_GROUP_PASSWORD.
bootstrap-group=
bootstrap-group-password=

# ---------------------------------------------------------------- logging
# error | warn | info | debug
log-level=info
# Rotated at 10 MB, 5 files kept. "none" = console only (containers, systemd).
log-file=logs/denis.log
# Log every client command (credentials and values are masked). Costs throughput.
send-client-actions=false
