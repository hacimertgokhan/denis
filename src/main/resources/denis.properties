# Every key can also be set from the environment as DENIS_<KEY> with - replaced by _
# (DENIS_DDB_PORT, DENIS_MAX_CONNECTIONS_PER_IP, ...). The ddb-* keys are also
# read without the prefix: DDB_PORT, DDB_ADDRESS, DDB_MAIN_TOKEN.

# Host
ddb-port=5142
ddb-address=localhost

# Denis
# Leave empty to generate a secure token on first start.
ddb-main-token=

# Options
language=auto
max-token-size=5
send-client-actions=true
use-delogg=false
start-with-details=false
# Open a desktop terminal window that tails the activity log (needs a display).
open-log-terminal=false

# Provisioning
# Create this login group on start-up when it does not exist yet, so a fresh
# install / container accepts LIN without running the interactive shell.
# Usually given as DENIS_BOOTSTRAP_GROUP / DENIS_BOOTSTRAP_GROUP_PASSWORD.
bootstrap-group=
bootstrap-group-password=

# Loggers
mac-address=true

# Security
max-connections-per-ip=12
use-token=true
change-token-on-every-new-client-session=true
ask-token-on-every-new-client-session=true
