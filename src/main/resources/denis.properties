# Every key can also be set from the environment as DENIS_<KEY> with - replaced by _
# (DENIS_DDB_PORT, DENIS_MAX_CONNECTIONS_PER_IP, ...). The ddb-* keys are also
# read without the prefix: DDB_PORT, DDB_ADDRESS, DDB_MAIN_TOKEN.
# `denis cli config` prints the effective value and source of every key.

# Host
ddb-port=5142
# Address shown at start-up (informational).
ddb-address=localhost
# Interface to listen on; 0.0.0.0 for every interface, 127.0.0.1 for local only.
bind-address=0.0.0.0

# Denis
# Leave empty to generate a secure token on first start.
ddb-main-token=

# Options
language=auto
send-client-actions=true
use-delogg=false
start-with-details=false
# Open a desktop terminal window that tails the activity log (needs a display).
open-log-terminal=false

# Provisioning
# Create this login group on start-up when it does not exist yet, so a fresh
# install / container accepts LIN without running the interactive shell.
# Usually given as DENIS_BOOTSTRAP_GROUP / DENIS_BOOTSTRAP_GROUP_PASSWORD.
bootstrap-group=
bootstrap-group-password=

# Connections
# Total concurrent client connections (one worker thread each).
max-connections=256
max-connections-per-ip=12
# Close a connection that sends nothing for this long; 0 disables the timeout.
client-idle-timeout-ms=0

# Persistence
# Every persisted change (SET -&save, SQL tables) is appended to
# database.journal at once and fsynced this often (like Redis appendfsync
# everysec). 0 fsyncs on every change.
persist-flush-interval-ms=1000
# A full database.bin snapshot replaces the journal this often while there are
# changes (also on SAVE and on shutdown).
persist-snapshot-interval-ms=30000
